<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_Gate 門禁快取優化調試端</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 30px; 
            background: #f4f6f9; 
            color: #333; 
        }
        .container { 
            max-width: 500px; 
            margin: 40px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 14px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }
        h2 { margin-top: 0; color: #111; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 25px; }
        button { 
            width: 90%;
            padding: 14px 24px; 
            font-size: 16px; 
            margin: 10px 0; 
            cursor: pointer; 
            border-radius: 8px; 
            border: none; 
            font-weight: bold; 
            transition: all 0.2s ease; 
        }
        #connectBtn { background: #007bff; color: white; }
        #connectBtn:hover { background: #0056b3; }
        #openBtn { background: #28a745; color: white; }
        #openBtn:hover { background: #218838; }
        #openBtn:disabled { background: #cccccc; cursor: not-allowed; }
        #setPwrBtn { background: #dc3545; color: white; }
        #setPwrBtn:hover { background: #c82333; }
        #setPwrBtn:disabled { background: #cccccc; cursor: not-allowed; }
        select { 
            width: 40%;
            padding: 12px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 1px solid #ccc;
            margin-right: 10px; 
            vertical-align: middle;
        }
        select:disabled { background: #f0f0f0; cursor: not-allowed; }
        .section { 
            border-top: 1px solid #eee; 
            margin-top: 25px; 
            padding-top: 20px; 
            text-align: left; 
            padding-left: 5%;
        }
        .section h3 { margin-bottom: 12px; font-size: 16px; color: #444; }
        #status { 
            font-size: 14px; 
            color: #444; 
            background: #e9ecef; 
            padding: 15px; 
            border-radius: 8px; 
            word-break: break-all; 
            margin-top: 25px; 
            text-align: left;
            line-height: 1.5;
            font-family: monospace;
        }
        .success-text { color: #28a745; font-weight: bold; }
        .error-text { color: #dc3545; font-weight: bold; }
        .info-text { color: #fd7e14; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>_Gate 藍牙通用控制台</h2>
    <div class="subtitle">環境限制：GitHub Pages (HTTPS 安全連線)</div>
    
    <div>
        <button id="connectBtn">🔌 1. 搜尋並連接門禁裝置</button>
    </div>

    <div class="section">
        <h3>門禁控制</h3>
        <button id="openBtn" disabled>🔓 2. 發送密文開門 (OPEN)</button>
    </div>

    <div class="section">
        <h3>發射功率配置</h3>
        <select id="pwrSelect" disabled>
            <option value="24">-24 dBm</option>
            <option value="21">-21 dBm</option>
            <option value="18">-18 dBm</option>
            <option value="15">-15 dBm</option>
            <option value="12" selected>-12 dBm</option>
            <option value="9">-9 dBm</option>
            <option value="6">-6 dBm</option>
            <option value="3">-3 dBm</option>
            <option value="0">0 dBm</option>
        </select>
        <button id="setPwrBtn" style="width: 45%; margin: 0; display: inline-block; vertical-align: middle;" disabled>⚙️ 設定功率</button>
    </div>
    
    <div id="status">狀態: 等待操作...</div>
</div>

<script>
    // 嚴格對應您的 ESP32 新版 UUID 與名稱定義
    const SERVICE_UUID = "4f475400-0000-0000-0000-000000000000";
    const KEY_CHAR_UUID = "b9eab6ea-0000-0000-0000-000000000000";
    const PWR_CHAR_UUID = "b9eab6eb-0000-0000-0000-000000000000";

    let bleDevice = null;
    let keyCharacteristic = null;
    let pwrCharacteristic = null;

    const connectBtn = document.getElementById('connectBtn');
    const openBtn = document.getElementById('openBtn');
    const pwrSelect = document.getElementById('pwrSelect');
    const setPwrBtn = document.getElementById('setPwrBtn');
    const statusText = document.getElementById('status');

    // 更新網頁按鈕可操作狀態
    function updateUIState(connected) {
        connectBtn.disabled = connected;
        openBtn.disabled = !connected;
        pwrSelect.disabled = !connected;
        setPwrBtn.disabled = !connected;
    }

    // 1. 藍牙強力盲掃連線
    connectBtn.addEventListener('click', async () => {
        statusText.innerHTML = "提示: 正在強制盲掃附近的藍牙...<br><span style='color:#007bff;'>請在瀏覽器彈窗中點選名為 <b>_Gate</b> 的裝置。</span>";
        try {
            // 使用相容性最高的全盲掃模式，避開底層 Service 快取過濾死鎖
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID] // 必須在此註冊，連線後才能順利越權存取門鎖服務
            });

            statusText.innerText = `已選取: ${bleDevice.name || '未命名'}，正在建立 GATT 連線...`;
            
            // 註冊中斷連線監聽事件
            bleDevice.addEventListener('gattserverdisconnected', () => {
                statusText.innerHTML = "狀態: <span class='info-text'>藍牙已斷開</span><br>提示：雙向快取清理成功！ESP32 正在重啟，現在您可以直接點擊按鈕進行下一次搜尋。";
                updateUIState(false);
                keyCharacteristic = null;
                pwrCharacteristic = null;
            });

            const server = await bleDevice.gatt.connect();
            statusText.innerText = "連線成功！正在獲取門鎖主服務...";
            
            const service = await server.getPrimaryService(SERVICE_UUID);
            statusText.innerText = "正在綁定資料傳輸通道...";
            
            // 同時獲取開鎖特徵值與功率特徵值
            keyCharacteristic = await service.getCharacteristic(KEY_CHAR_UUID);
            pwrCharacteristic = await service.getCharacteristic(PWR_CHAR_UUID);

            statusText.innerHTML = "狀態: <span class='success-text'>連線成功！資料通道已就緒。</span>";
            updateUIState(true);

        } catch (error) {
            console.error(error);
            statusText.innerHTML = "狀態: <span class='error-text'>連線失敗！</span><br>" +
                                   `<b>錯誤類型:</b> ${error.name}<br>` +
                                   `<b>詳細訊息:</b> ${error.message}`;
            updateUIState(false);
        }
    });

    // 2. 傳送開門密文 (主動釋放快取控制)
    openBtn.addEventListener('click', async () => {
        if (!keyCharacteristic || !bleDevice) return;
        try {
            statusText.innerText = "正在向通道甩入開門密文 (OPEN)...";
            const encoder = new TextEncoder();
            const data = encoder.encode("OPEN"); // 配合 ESP32 的 .equalsIgnoreCase("OPEN")
            
            // 寫入無回應特徵
            await keyCharacteristic.writeValueWithoutResponse(data);
            statusText.innerHTML = "<span class='success-text'>指令發送成功！</span><br>網頁正在主動中斷藍牙以強制刷新系統快取...";
            openBtn.disabled = true;

            // 【核心修正】：送出後延遲 200 毫秒，網頁端立刻主動斷開連線！
            // 這能強迫手機/電腦的作業系統釋放這條藍牙通道，杜絕「第二次搜尋不到」的硬體死穴。
            setTimeout(() => {
                if (bleDevice && bleDevice.gatt.connected) {
                    bleDevice.gatt.disconnect();
                    console.log("[WebBLE] 網頁已成功主動調用 disconnect() 沖刷快取。");
                }
            }, 200);
            
        } catch (error) {
            console.error(error);
            statusText.innerHTML = `狀態: <span class='error-text'>發送失敗: ${error.message}</span>`;
        }
    });

    // 3. 修改功率配置 (主動釋放快取控制)
    setPwrBtn.addEventListener('click', async () => {
        if (!pwrCharacteristic || !bleDevice) return;
        const pwrVal = pwrSelect.value;
        try {
            statusText.innerText = `正在發送功率修改指令: SET_PWR:${pwrVal}...`;
            const encoder = new TextEncoder();
            const data = encoder.encode(`SET_PWR:${pwrVal}`);
            
            await pwrCharacteristic.writeValueWithoutResponse(data);
            statusText.innerHTML = `<span class='success-text'>功率變更成功 (-${pwrVal} dBm)！</span><br>網頁主動斷開連線中...`;
            setPwrBtn.disabled = true;

            // 更改功率後同樣觸發主動斷開，釋放快取
            setTimeout(() => {
                if (bleDevice && bleDevice.gatt.connected) {
                    bleDevice.gatt.disconnect();
                }
            }, 200);
            
        } catch (error) {
            console.error(error);
            statusText.innerHTML = `狀態: <span class='error-text'>功率設定失敗: ${error.message}</span>`;
        }
    });
</script>

</body>
</html>
