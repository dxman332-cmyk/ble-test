<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_Gate 終極調試端</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding-top: 50px; background: #f8f9fa; }
        .box { max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        button { width: 100%; padding: 15px; font-size: 16px; margin: 10px 0; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
        #connectBtn { background: #007bff; color: white; }
        #openBtn { background: #28a745; color: white; }
        #openBtn:disabled { background: #dddddd; cursor: not-allowed; }
        #status { font-size: 15px; color: #444; background: #e9ecef; padding: 12px; border-radius: 6px; text-align: left; word-break: break-all; margin-top: 20px; font-family: monospace; }
        .err { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>_Gate 藍牙終極調試端</h2>
        <p style="font-size: 13px; color:#666;">環境：GitHub Pages (HTTPS)</p>
        
        <button id="connectBtn">🔌 1. 啟動盲掃連線</button>
        <button id="openBtn" disabled>🔓 2. 發送開門指令</button>
        
        <div id="status">狀態: 等待操作...</div>
    </div>

    <script>
        const SERVICE_UUID = "4f475400-0000-0000-0000-000000000000";
        const KEY_CHAR_UUID = "b9eab6ea-0000-0000-0000-000000000000";

        let bleDevice = null;
        let keyCharacteristic = null;

        const connectBtn = document.getElementById('connectBtn');
        const openBtn = document.getElementById('openBtn');
        const statusText = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            statusText.innerHTML = "提示: 正在強制盲掃附近的藍牙...<br>請在彈窗中尋找名為 <b>_Gate</b> 的裝置。";
            try {
                // 使用完全不設限的掃描模式
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                statusText.innerText = `已選取: ${bleDevice.name || '未命名'}，正在連接...`;
                
                bleDevice.addEventListener('gattserverdisconnected', () => {
                    statusText.innerHTML = "狀態: <span class='err'>藍牙已斷開</span> (晶片重啟成功，快取已沖刷！)";
                    openBtn.disabled = true;
                    connectBtn.disabled = false;
                });

                const server = await bleDevice.gatt.connect();
                statusText.innerText = "連線成功！正在獲取 primary 服務...";
                
                const service = await server.getPrimaryService(SERVICE_UUID);
                keyCharacteristic = await service.getCharacteristic(KEY_CHAR_UUID);

                statusText.innerHTML = "狀態: <span style='color:green;font-weight:bold;'>連線成功，通道已就緒！</span>";
                openBtn.disabled = false;
                connectBtn.disabled = true;

            } catch (error) {
                console.error(error);
                // 強力捕獲底層錯誤代碼
                statusText.innerHTML = `狀態: <span class='err'>連線失敗！</span><br>` +
                                       `<b>錯誤名稱:</b> ${error.name}<br>` +
                                       `<b>詳細訊息:</b> ${error.message}`;
            }
        });

        openBtn.addEventListener('click', async () => {
            if (!keyCharacteristic) return;
            try {
                statusText.innerText = "發送 OPEN 中...";
                const encoder = new TextEncoder();
                const data = encoder.encode("OPEN");
                
                await keyCharacteristic.writeValueWithoutResponse(data);
                statusText.innerText = "指令已發送！等待 ESP32 自動重啟...";
                openBtn.disabled = true;
            } catch (error) {
                statusText.innerHTML = `狀態: <span class='err'>發送失敗: ${error.message}</span>`;
            }
        });
    </script>
</body>
</html>
