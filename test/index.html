<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGT_GATE BLE 網頁測試端</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; }
        .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        #status { font-weight: bold; color: blue; }
        select { padding: 8px; font-size: 16px; }
    </style>
</head>
<body>

    <h2>OGT_GATE BLE 網頁測試控制台</h2>
    
    <div class="section">
        <h3>1. 連線控制</h3>
        <button id="connectBtn">連接藍牙裝置</button>
        <button id="disconnectBtn" disabled>斷開連接</button>
        <p>目前狀態: <span id="status">未連接</span></p>
    </div>

    <div class="section">
        <h3>2. 開門控制</h3>
        <button id="openBtn" disabled>傳送 OPEN 指令</button>
        <button id="customSendBtn" disabled>傳送自訂密碼</button>
    </div>

    <div class="section">
        <h3>3. 發射功率設定 (Tx Power)</h3>
        <select id="pwrSelect" disabled>
            <option value="-24">-24 dBm</option>
            <option value="-21">-21 dBm</option>
            <option value="-18">-18 dBm</option>
            <option value="-15">-15 dBm</option>
            <option value="-12" selected>-12 dBm</option>
            <option value="-9">-9 dBm</option>
            <option value="-6">-6 dBm</option>
            <option value="-3">-3 dBm</option>
            <option value="0">0 dBm</option>
        </select>
        <button id="setPwrBtn" disabled>設定功率</button>
    </div>

    <script>
        // 對應 ESP32 的 UUID 設定
        const SERVICE_UUID = "4f475400-0000-0000-0000-000000000000";
        const KEY_CHAR_UUID = "b9eab6ea-0000-0000-0000-000000000000";
        const POWER_CHAR_UUID = "b9eab6eb-0000-0000-0000-000000000000";

        let bleDevice = null;
        let bleServer = null;
        let bleService = null;
        let keyCharacteristic = null;
        let powerCharacteristic = null;

        // DOM 元素
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const openBtn = document.getElementById('openBtn');
        const customSendBtn = document.getElementById('customSendBtn');
        const pwrSelect = document.getElementById('pwrSelect');
        const setPwrBtn = document.getElementById('setPwrBtn');
        const statusText = document.getElementById('status');

        // 更新 UI 狀態
        function setControlsEnabled(enabled) {
            disconnectBtn.disabled = !enabled;
            openBtn.disabled = !enabled;
            customSendBtn.disabled = !enabled;
            pwrSelect.disabled = !enabled;
            setPwrBtn.disabled = !enabled;
            connectBtn.disabled = enabled;
        }

        // 1. 連接藍牙裝置
        connectBtn.addEventListener('click', async () => {
            statusText.innerText = "正在掃描裝置...";
            try {
                // 依據 Service UUID 進行過濾
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                statusText.innerText = `正在連接到 ${bleDevice.name || 'OGT_GATE'}...`;
                
                // 監聽斷開事件
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                bleServer = await bleDevice.gatt.connect();
                statusText.innerText = "正在獲取服務...";

                bleService = await bleServer.getPrimaryService(SERVICE_UUID);
                
                // 獲取特徵值
                keyCharacteristic = await bleService.getCharacteristic(KEY_CHAR_UUID);
                powerCharacteristic = await bleService.getCharacteristic(POWER_CHAR_UUID);

                statusText.innerText = "已連線，可以開始測試";
                setControlsEnabled(true);

            } catch (error) {
                console.error(error);
                statusText.innerText = "連線失敗: " + error.message;
                setControlsEnabled(false);
            }
        });

        // 2. 傳送開門/文字指令 (寫入 KEY_CHAR_UUID)
        async function sendCommand(text) {
            if (!keyCharacteristic) return;
            try {
                statusText.innerText = `正在傳送指令: ${text}`;
                const encoder = new TextEncoder();
                const data = encoder.encode(text);
                
                // 【核心修正】：因為 ESP32 只開了 WRITE 屬性，此處必須用 WithoutResponse
                await keyCharacteristic.writeValueWithoutResponse(data);
                
                statusText.innerText = `指令 [${text}] 傳送成功`;
            } catch (error) {
                console.error(error);
                statusText.innerText = "傳送失敗: " + error.message;
            }
        }

        openBtn.addEventListener('click', () => sendCommand("OPEN"));
        customSendBtn.addEventListener('click', () => {
            const pwd = prompt("請輸入要轉送至後端的自訂資料/密碼:", "MY_SECRET_KEY_123");
            if (pwd) sendCommand(pwd);
        });

        // 3. 設定發射功率 (寫入 POWER_CHAR_UUID)
        setPwrBtn.addEventListener('click', async () => {
            if (!powerCharacteristic) return;
            const selectedPower = pwrSelect.value;
            const pwrCommand = `SET_PWR:${selectedPower}`;
            
            try {
                statusText.innerText = `正在設定功率: ${pwrCommand}`;
                const encoder = new TextEncoder();
                const data = encoder.encode(pwrCommand);
                
                // 【核心修正】：同樣必須使用 WithoutResponse
                await powerCharacteristic.writeValueWithoutResponse(data);
                
                statusText.innerText = `功率設定指令 [${pwrCommand}] 已送出 (裝置將重啟廣播)`;
            } catch (error) {
                console.error(error);
                statusText.innerText = "功率設定失敗: " + error.message;
            }
        });

        // 4. 斷開連接
        disconnectBtn.addEventListener('click', () => {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
        });

        function onDisconnected() {
            statusText.innerText = "已與藍牙裝置斷開連接";
            setControlsEnabled(false);
            bleDevice = null;
            bleServer = null;
            bleService = null;
            keyCharacteristic = null;
            powerCharacteristic = null;
        }
    </script>
</body>
</html>
